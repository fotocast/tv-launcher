<h2>📺 TV Launcher – App</h2>
<p>This installs the <b>TV Launcher</b> app – your remote control for the Mac connected to your TV.</p>
<p>Just click <b>Continue</b> and <b>Install</b>. The app opens by itself and finds the TV Mac on your Wi-Fi.</p>
<div class="box">The Mac connected to the TV needs <b>TV-Launcher-Server.pkg</b>. Install that one there.</div>
